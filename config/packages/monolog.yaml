monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: sinks
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            # Une erreur est écrite à deux endroits : stderr (comme avant) ET dans var/log/prod.log.
            # Sur l'hébergement mutualisé, stderr n'est lisible nulle part : sans fichier, un 500 ne
            # laisse aucune trace et on ne peut pas savoir ce qui a planté. Le fichier ne reçoit que
            # les requêtes en erreur (fingers_crossed), avec tout ce qui a précédé. « whatfailuregroup » :
            # si le fichier est impossible à écrire, on l'ignore au lieu de faire planter la page d'erreur.
            sinks:
                type: whatfailuregroup
                members: [nested, file]
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            file:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                max_files: 14 # un fichier par jour, les plus anciens sont effacés tout seuls
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
